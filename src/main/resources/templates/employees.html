<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>ReachLynk Employee Management</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

    <!-- Application Header -->

    <div class="text-center mb-4">

        <h1 class="text-primary">
            ReachLynk Employee Management
        </h1>

        <p class="text-muted">
            Employee Directory and Administration Portal
        </p>

    </div>


    <!-- Add Employee Form -->

    <div class="card shadow-sm mb-4">

        <div class="card-header bg-primary text-white">

            <h4 class="mb-0">Add New Employee</h4>

        </div>

        <div class="card-body">

            <form th:action="@{/employees}"
                  th:object="${employee}"
                  method="post">

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Employee Name
                        </label>

                        <input type="text"
                               th:field="*{name}"
                               class="form-control"
                               placeholder="Enter employee name"
                               required>

                    </div>


                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Email Address
                        </label>

                        <input type="email"
                               th:field="*{email}"
                               class="form-control"
                               placeholder="Enter email address"
                               required>

                    </div>


                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Department
                        </label>

                        <input type="text"
                               th:field="*{department}"
                               class="form-control"
                               placeholder="Enter department"
                               required>

                    </div>


                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Designation
                        </label>

                        <input type="text"
                               th:field="*{designation}"
                               class="form-control"
                               placeholder="Enter designation"
                               required>

                    </div>

                </div>

                <button type="submit"
                        class="btn btn-primary">

                    Add Employee

                </button>

            </form>

        </div>

    </div>


    <!-- Employee Directory -->

    <div class="card shadow-sm">

        <div class="card-header bg-dark text-white">

            <h4 class="mb-0">Employee Directory</h4>

        </div>

        <div class="card-body">

            <div class="table-responsive">

                <table class="table table-striped table-hover">

                    <thead class="table-dark">

                        <tr>

                            <th>ID</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Department</th>
                            <th>Designation</th>
                            <th>Action</th>

                        </tr>

                    </thead>

                    <tbody>

                        <tr th:each="emp : ${employees}">

                            <td th:text="${emp.id}"></td>

                            <td th:text="${emp.name}"></td>

                            <td th:text="${emp.email}"></td>

                            <td th:text="${emp.department}"></td>

                            <td th:text="${emp.designation}"></td>

                            <td>

                                <form th:action="@{/employees/delete/{id}(id=${emp.id})}"
                                      method="post">

                                    <button type="submit"
                                            class="btn btn-danger btn-sm">

                                        Delete

                                    </button>

                                </form>

                            </td>

                        </tr>

                        <tr th:if="${#lists.isEmpty(employees)}">

                            <td colspan="6"
                                class="text-center text-muted">

                                No employees found.

                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>


    <!-- Footer -->

    <footer class="text-center mt-4 mb-4">

        <p class="text-muted">
            ReachLynk Tech | Java Spring Boot Application
        </p>

    </footer>

</div>

</body>

</html>
